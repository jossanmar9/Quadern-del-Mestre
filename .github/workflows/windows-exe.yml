# Fa l'executable de Windows (QuadernDelMestre.exe) amb PyInstaller.
# - En cada etiqueta v* (per exemple v1.0) el publica en una Release de GitHub.
# - També es pot llançar a mà des de la pestanya Actions («Run workflow»), triant una etiqueta.
name: Executable de Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Regenera quadern.py a partir de src/
        run: python build.py

      - name: Fa l'executable
        run: pyinstaller --onefile --name QuadernDelMestre --icon logo.ico quadern.py

      - name: Prova que arranca
        shell: pwsh
        run: |
          $p = Start-Process dist\QuadernDelMestre.exe -ArgumentList "--sense-navegador","--sense-qr","--port","8799" -PassThru
          Start-Sleep -Seconds 6
          $r = Invoke-WebRequest http://localhost:8799/api/hello -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "El servidor no respon" }
          $s = Invoke-WebRequest http://localhost:8799/api/srd -UseBasicParsing
          if ($s.StatusCode -ne 200) { throw "No carrega el compendi" }
          Stop-Process -Id $p.Id

      - name: Empaqueta
        shell: pwsh
        run: |
          New-Item -ItemType Directory QuadernDelMestre | Out-Null
          Copy-Item dist\QuadernDelMestre.exe, README.md, README.es.md, LICENSE, NOTICE.md QuadernDelMestre\
          Copy-Item docs\Guia-Quadern-del-Mestre.pdf, docs\Guia-Quadern-del-Mestre-es.pdf QuadernDelMestre\
          Compress-Archive QuadernDelMestre\* QuadernDelMestre-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: QuadernDelMestre-windows
          path: QuadernDelMestre-windows.zip

      - name: Publica la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: QuadernDelMestre-windows.zip
          generate_release_notes: true
